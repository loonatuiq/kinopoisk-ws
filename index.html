<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg">
  <title>Kinopoisk WS</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#111318; color:#f2f3f5; padding:20px 16px 40px; }
    .container { width:min(760px,100%); margin:0 auto; }
    header { padding:18px 0 20px; }
    h1 { margin:0 0 7px; font-size:28px; }
    .subtitle { margin:0; color:#aeb4bf; line-height:1.45; }
    .search { display:flex; gap:10px; }
    input { flex:1; min-width:0; padding:14px 15px; border:1px solid #3a404b; border-radius:11px; background:#1b1e24; color:#fff; font-size:16px; outline:none; }
    input:focus { border-color:#747c8b; }
    button,.open { border:0; border-radius:10px; padding:12px 16px; background:#f0f1f3; color:#111318; font-size:14px; font-weight:700; cursor:pointer; text-decoration:none; white-space:nowrap; }
    button:disabled { opacity:.55; cursor:wait; }
    .status { min-height:22px; margin:15px 0 9px; color:#9ea5b1; font-size:14px; }
    .error { color:#ff8d8d !important; }
    .results { display:grid; gap:10px; }
    .card { display:flex; gap:14px; padding:13px; background:#1b1e24; border:1px solid #2c3038; border-radius:13px; }
    .poster { width:72px; height:108px; flex:0 0 72px; object-fit:cover; border-radius:8px; background:#111318; }
    .no-poster { display:grid; place-items:center; color:#737b88; font-size:11px; text-align:center; }
    .info { min-width:0; flex:1; display:flex; flex-direction:column; }
    .title { font-size:17px; font-weight:700; line-height:1.3; margin-bottom:5px; }
    .meta,.rating { color:#9ea5b1; font-size:13px; line-height:1.5; }
    .open { align-self:flex-start; margin-top:auto; background:#343a45; color:#fff; }
    .open:hover { background:#444b58; }
    .direct { margin-top:30px; padding-top:24px; border-top:1px solid #2c3038; }
    .direct h2 { font-size:18px; margin:0 0 12px; }
    .direct-row { display:flex; gap:10px; }
    .direct-result { margin-top:12px; padding:12px; border-radius:9px; background:#1b1e24; color:#bfc5ce; word-break:break-all; font-size:13px; display:none; }
    .install { display:none; margin-top:12px; width:100%; }
    @media (max-width:560px) {
      .search,.direct-row { flex-direction:column; }
      .search button,.direct-row button { width:100%; }
      .card { align-items:flex-start; }
      .open { margin-top:10px; }
    }
  </style>
</head>
<body>
<main class="container">
  <header>
    <h1>Поиск фильмов и сериалов</h1>
    <p class="subtitle">Найди фильм по названию — сервис автоматически создаст ссылку на Kinopoisk.ws.</p>
  </header>

  <div class="search">
    <input id="searchInput" type="search" placeholder="Например: Интерстеллар" autocomplete="off">
    <button id="searchBtn" type="button">Найти</button>
  </div>
  <button id="installBtn" class="install" type="button">Установить приложение</button>

  <div id="status" class="status"></div>
  <div id="results" class="results"></div>

  <section class="direct">
    <h2>Преобразовать готовую ссылку</h2>
    <div class="direct-row">
      <input id="urlInput" type="url" placeholder="https://www.kinopoisk.ru/film/5230825/...">
      <button id="convertBtn" type="button">Преобразовать</button>
    </div>
    <div id="directResult" class="direct-result"></div>
  </section>
</main>

<script>
  const API_KEY = "E81D4EA-VR34QJD-QXVBDWP-VXCV3KT";
  const API_URL = "https://api.poiskkino.dev/v1.4/movie/search";

  const $ = id => document.getElementById(id);
  const searchInput = $("searchInput");
  const searchBtn = $("searchBtn");
  const status = $("status");
  const results = $("results");

  function movieId(m) {
    return m.id ?? m.kinopoiskId ?? m.kinopoisk_id ?? m.externalId?.kp;
  }
  function title(m) {
    if (typeof m.name === "string") return m.name;
    if (m.name?.ru) return m.name.ru;
    if (m.name?.en) return m.name.en;
    return m.alternativeName || "Без названия";
  }
  function year(m) { return m.year ?? m.releaseYear ?? ""; }
  function poster(m) { return m.poster?.url ?? m.poster?.previewUrl ?? m.poster?.preview ?? ""; }
  function rating(m) {
    const kp = m.rating?.kp, imdb = m.rating?.imdb;
    return kp ? `КП: ${kp}` : imdb ? `IMDb: ${imdb}` : "";
  }
  function type(m) {
    return (m.isSeries === true || m.type === "series") ? "Сериал" :
           (m.type === "movie" ? "Фильм" : "");
  }
  function wsUrl(id) { return `https://www.kinopoisk.ws/film/${encodeURIComponent(id)}/`; }

  function render(items) {
    results.innerHTML = "";
    if (!items.length) { status.textContent = "Ничего не найдено."; return; }
    status.textContent = `Найдено: ${items.length}`;

    for (const m of items) {
      const id = movieId(m);
      if (!id) continue;

      const card = document.createElement("article");
      card.className = "card";

      const p = poster(m);
      if (p) {
        const img = document.createElement("img");
        img.className = "poster"; img.src = p; img.alt = ""; img.loading = "lazy";
        img.onerror = () => {
          img.remove();
          const f = document.createElement("div");
          f.className = "poster no-poster"; f.textContent = "Нет постера";
          card.prepend(f);
        };
        card.appendChild(img);
      } else {
        const f = document.createElement("div");
        f.className = "poster no-poster"; f.textContent = "Нет постера";
        card.appendChild(f);
      }

      const info = document.createElement("div");
      info.className = "info";

      const t = document.createElement("div");
      t.className = "title"; t.textContent = title(m);
      info.appendChild(t);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = [year(m), type(m)].filter(Boolean).join(" · ");
      info.appendChild(meta);

      const r = rating(m);
      if (r) {
        const re = document.createElement("div");
        re.className = "rating"; re.textContent = r;
        info.appendChild(re);
      }

      const a = document.createElement("a");
      a.className = "open"; a.href = wsUrl(id);
      a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "Открыть .ws";
      info.appendChild(a);

      card.appendChild(info);
      results.appendChild(card);
    }
  }

  async function searchMovies() {
    const q = searchInput.value.trim();
    if (!q) {
      status.className = "status error";
      status.textContent = "Введи название фильма или сериала.";
      results.innerHTML = "";
      return;
    }

    searchBtn.disabled = true;
    status.className = "status";
    status.textContent = "Ищу...";
    results.innerHTML = "";

    try {
      const u = new URL(API_URL);
      u.searchParams.set("query", q);
      u.searchParams.set("page", "1");
      u.searchParams.set("limit", "10");

      const response = await fetch(u, { headers: { "X-API-KEY": API_KEY } });
      if (!response.ok) {
        if (response.status === 401) throw new Error("API-ключ отклонён (401).");
        if (response.status === 429) throw new Error("Превышен лимит запросов API.");
        throw new Error(`Ошибка API: HTTP ${response.status}`);
      }

      const data = await response.json();
      const items = Array.isArray(data) ? data : (data.docs ?? data.results ?? []);
      render(items);
    } catch (e) {
      status.className = "status error";
      status.textContent = e.message || "Не удалось выполнить поиск.";
    } finally {
      searchBtn.disabled = false;
    }
  }

  searchBtn.addEventListener("click", searchMovies);
  searchInput.addEventListener("keydown", e => { if (e.key === "Enter") searchMovies(); });

  $("convertBtn").addEventListener("click", () => {
    const box = $("directResult");
    box.className = "direct-result";
    box.style.display = "none";
    try {
      const u = new URL($("urlInput").value.trim());
      const h = u.hostname.toLowerCase();
      if (h !== "kinopoisk.ru" && h !== "www.kinopoisk.ru") throw new Error("Нужна ссылка на kinopoisk.ru");
      u.hostname = "www.kinopoisk.ws";
      box.innerHTML = "";
      const text = document.createElement("div");
      text.textContent = u.toString();
      box.appendChild(text);
      const a = document.createElement("a");
      a.className = "open"; a.href = u.toString(); a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "Открыть";
      a.style.display = "inline-flex"; a.style.marginTop = "10px";
      box.appendChild(a);
      box.style.display = "block";
    } catch(e) {
      box.className = "direct-result error";
      box.textContent = e.message || "Некорректная ссылка.";
      box.style.display = "block";
    }
  });

  // PWA installation
  let deferredPrompt = null;
  const installBtn = $("installBtn");

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
  });

  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = "none";
  });

  window.addEventListener("appinstalled", () => {
    installBtn.style.display = "none";
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(console.error);
    });
  }
</script>
</body>
</html>
