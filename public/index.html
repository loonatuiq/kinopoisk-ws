<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Кино .WS">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
<title>Kinopoisk WS</title>
</head>
<body>
<main class="container">
  <header>
    <h1>Поиск фильмов и сериалов</h1>
    <p class="subtitle">Найди фильм по названию — сервис автоматически создаст ссылку на Kinopoisk.ws.</p>
    <button id="installBtn" class="btn btn-quiet install" type="button" hidden>Установить приложение</button>
    <div id="iosHint" class="ios-hint" hidden>
      <span>Чтобы установить приложение, нажми «Поделиться» и выбери «На экран “Домой”».</span>
      <button id="iosHintClose" class="btn btn-quiet" type="button">Понятно</button>
    </div>
  </header>

  <form id="searchForm" class="search-form" role="search" novalidate>
    <label class="sr-only" for="searchInput">Название фильма или сериала</label>
    <div class="field">
      <input id="searchInput" type="search" placeholder="Например: Интерстеллар" autocomplete="off" autocapitalize="off" enterkeyhint="search" maxlength="100">
      <button id="clearBtn" class="clear" type="button" aria-label="Очистить поле" hidden>×</button>
    </div>
    <button id="searchBtn" class="btn" type="submit">Найти</button>
  </form>

  <div id="tabs" class="tabs" role="tablist" aria-label="Разделы">
    <button id="searchTab" class="tab" type="button" role="tab" aria-selected="true" aria-controls="results">Поиск</button>
    <button id="favoritesTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="results">Избранное<span id="favoriteCount"></span></button>
  </div>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="results" class="results" role="tabpanel" aria-labelledby="searchTab" aria-busy="false"></div>
  <button id="moreBtn" class="btn btn-quiet more" type="button" hidden>Показать ещё</button>

  <section class="direct">
    <h2>Преобразовать готовую ссылку</h2>
    <form id="convertForm" class="direct-row" novalidate>
      <label class="sr-only" for="urlInput">Ссылка на фильм с kinopoisk.ru</label>
      <div class="field">
        <input id="urlInput" type="text" inputmode="url" placeholder="https://www.kinopoisk.ru/film/5230825/" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
      <button id="convertBtn" class="btn" type="submit">Преобразовать</button>
    </form>
    <div id="directResult" class="direct-result" role="status" aria-live="polite" hidden></div>
  </section>
</main>

<script src="./app.js" defer></script>
</body>
</html>
